[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "screenguide"
version = "0.1.0"
description = "Step-by-step guidance for any task in the Linux desktop interface."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["jeepney>=0.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
screenguide = "screenguide.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/screenguide"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
